<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MOMENTUM — Personal Life Operating System</title>
    <meta name="description" content="Your life. Your goals. Your progress. A cohesive Personal Life Operating System that helps you transform long-term ambitions into daily actions." />
    <meta name="theme-color" content="#252A2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MOMENTUM" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('momentum_life_os_state_v1');
          var theme = 'light';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.preferences && parsed.preferences.theme) {
              theme = parsed.preferences.theme;
            }
          }
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var bg = isDark ? '#252A2E' : '#F7F1E8';
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          root.style.backgroundColor = bg;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', bg);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:title" content="MOMENTUM — Personal Life Operating System" />
    <meta property="og:description" content="Your life. Your goals. Your progress. A cohesive Personal Life Operating System that helps you transform long-term ambitions into daily actions." />

    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-accent/35 selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
